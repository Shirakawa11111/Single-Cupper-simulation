description: "Week-4 experiment alignment lock v4: reduced elastic scale + slight strain trim from sweep best point."
virtual_cycle:
  task: "fatigue_lowamp_align_locked_v4"
  auto_output: false
  cycles: 80
  max_strain: 0.00127324197
  cycle_points: 80
  orientation_vector: [-1.0, 1.0, 1.0]
  grid_shape: [64, 32, 8]
  grid_spacing: [1.0, 1.0, 1.0]
  grid_periodic: [true, true, false]
  stable_window: 5
  stable_tol: 0.02
  stable_metrics: ["plastic_range", "rss_peak_nd"]
  stable_min_cycles: 5
  pfc_active: false
  gnd_active: true
  gnd_burgers: 1.0
  h_gnd: 0.0
  toughness_scale: 0.1

  # Solver lock
  mech_max_iters: 120
  mech_outer_max_iters: 3
  mech_tol: 2.0e-5
  mech_outer_tol: 2.0e-6
  mech_regularization: 2.5
  mech_solution_abs_limit: 8.0
  mech_accept_rel_residual: 0.01
  mech_clip_solution_on_limit: true
  mech_unilateral_mode: volumetric
  mech_preconditioner: jacobi
  crack_max_iters: 1200
  crack_length_threshold: 0.995
  failure_threshold: 0.999

  # Week-4 sweep best (keep anisotropy ratios)
  c11: 0.58
  c12: 0.418122
  c44: 0.259666

  csv_output: sim/tests/regress_runs/2026-02-07/fatigue_lowamp_align_locked_v4/virtual_cycle.csv
  analysis_csv: sim/tests/regress_runs/2026-02-07/fatigue_lowamp_align_locked_v4/virtual_cycle_analysis.csv
  stress_strain_csv: sim/tests/regress_runs/2026-02-07/fatigue_lowamp_align_locked_v4/virtual_cycle_stress_strain.csv
