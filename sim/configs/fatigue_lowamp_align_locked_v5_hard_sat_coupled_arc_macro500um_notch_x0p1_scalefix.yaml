description: macro500um 6pct probe with notch x0.1 + nondim kinematics + hard displacement BC
virtual_cycle:
  task: fatigue_lowamp_align_locked_v5_hard_sat_coupled_arc_macro500um_notch_x0p1_scalefix
  auto_output: false
  cycles: 1
  max_strain: 0.06
  cycle_points: 24
  orientation_vector: [-1.0, 1.0, 1.0]
  schmid_mode: crystal_loading_axis
  schmid_crystal_loading_axis: [1.0, 1.0, 1.0]
  load_axis_sample: [1.0, 0.0, 0.0]

  # ~529 um x 253 um x 69 um
  grid_shape: [24, 12, 4]
  grid_spacing: [2.3e-5, 2.3e-5, 2.3e-5]
  grid_periodic: [false, false, false]

  # Arc-notch shrunk to about 1/10 effective width versus the previous broad notch.
  arc_notch:
    center: [2.65e-4, 3.05e-4]
    radius: 6.0e-5
    surface: y_max
    x_range: [2.50e-4, 2.58e-4]
    z_range: [0.0, 6.9e-5]
    crack_value: 0.50
    min_cells_x: 1
  arc_notch_min_cells_x: 1

  pfc_active: true
  gnd_active: true
  gnd_burgers: 1.0
  h_gnd: 2.0e-5
  toughness_scale: 1.3

  mech_max_iters: 500
  mech_outer_max_iters: 3
  mech_tol: 1.0e-6
  mech_outer_tol: 8.0e-7
  mech_regularization: 180.0
  mech_solution_abs_limit: 3.0e-3
  mech_accept_rel_residual: 5.0e-2
  mech_accept_incomplete_cg: false
  mech_enable_gmres_fallback: true
  mech_gmres_restart: 160
  mech_gmres_maxiter: 500
  mech_clip_solution_on_limit: false
  mech_unilateral_mode: volumetric
  mech_preconditioner: jacobi
  mech_unilateral: false
  mech_displacement_bc_x: true
  mech_displacement_bc_penalty: 1.0e6
  mech_displacement_bc_anchor_lateral: true
  mech_displacement_bc_hard: true
  mech_nondim_kinematics: true

  crack_max_iters: 320
  crack_length_threshold: 0.995
  failure_threshold: 0.999

  coupling_inner_iters: 2
  coupling_min_iters: 1
  coupling_tol: 1.5e-3
  coupling_stress_tol: 1.0e-3
  post_crack_mech_correction: true

  c11: 0.58
  c12: 0.418122
  c44: 0.259666
  yield_tau: 8.5e-5
  flow_scale: 1.0e-3
  gamma0: 8.0e-3
  slip_exponent: 12.0
  visco_exponent: 3.0
  plastic_relax: 0.1
  linear_hardening: 1.2e-4
  h_iso: 1.2e-4
  yield_tau_inf: 6.0e-4
  h0_iso: 6.0e-3
  kin_c: 0.022
  kin_d: 10.0
  kin_c2: 0.0025
  kin_d2: 1.0

  max_strain_step: 7.5e-4
