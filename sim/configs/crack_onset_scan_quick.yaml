description: "Quick smoke config for crack-onset scanner."

defaults:
  virtual_cycle:
    cycles: 1
    segment_steps: 12
    orientation_vector: [1.0, 1.0, 1.0]
    grid_shape: [16, 8, 4]
    grid_spacing: [1.0, 1.0, 1.0]
    grid_periodic: [true, true, false]
    pfc_active: false
    gnd_active: true
    stress_mu_weight: 0.0
    notch_box:
      - [5.0, 7.0]
      - [3.0, 4.0]
      - [1.0, 2.0]
    notch_crack_value: 0.4
    max_strain: 0.004
    toughness_scale: 0.1
    mech_max_iters: 80
    mech_outer_max_iters: 2
    mech_tol: 5.0e-5
    mech_outer_tol: 5.0e-6
  criteria:
    min_crack_delta: 0.0
    min_crack_mean_delta: 0.0
    min_onset_cases: 0
    max_runtime_warnings: 200

cases:
  - name: "quick_notch"
    virtual_cycle: {}
