description: "Quick smoke config for crack-onset scanner."

defaults:
  virtual_cycle:
    cycles: 1
    segment_steps: 12
    orientation_vector: [1.0, 1.0, 1.0]
    grid_shape: [16, 8, 4]
    grid_spacing: [1.0, 1.0, 1.0]
    grid_periodic: [true, true, false]
    pfc_active: false
    gnd_active: true
    stress_mu_weight: 0.0
    notch_box:
      - [5.0, 7.0]
      - [3.0, 4.0]
      - [1.0, 2.0]
    notch_crack_value: 0.4
    crack_length_threshold: 0.4
    max_strain: 0.004
    toughness_scale: 0.1
    mech_max_iters: 80
    mech_outer_max_iters: 2
    mech_tol: 5.0e-5
    mech_outer_tol: 5.0e-6
    mech_regularization: 1.0
    mech_accept_rel_residual: 1.0e-2
    mech_accept_incomplete_cg: true
    mech_enable_gmres_fallback: false
    mech_solution_abs_limit: 10.0
    mech_clip_solution_on_limit: true
    mech_unilateral_mode: volumetric
    mech_preconditioner: jacobi
  criteria:
    min_crack_delta: 0.0
    min_crack_mean_delta: 0.0
    allow_mean_aux: true
    min_crack_length_for_mean_aux: 0.0
    min_onset_cases: 0
    max_runtime_warnings: 200
    max_mechanical_not_accepted_steps: 48
    max_crack_cg_nonconverged_steps: 12
    max_nonfinite_count: 0

cases:
  - name: "quick_notch"
    virtual_cycle: {}
