description: "Phase-2 crack-onset screening matrix (small grid, notch-biased)."

defaults:
  virtual_cycle:
    cycles: 4
    cycle_points: 80
    orientation_vector: [1.0, 1.0, 1.0]
    grid_shape: [32, 16, 8]
    grid_spacing: [1.0, 1.0, 1.0]
    grid_periodic: [true, true, false]
    pfc_active: false
    gnd_active: true
    stress_mu_weight: 0.0
    notch_box:
      - [11.2, 14.4]
      - [7.2, 8.8]
      - [2.8, 5.2]
    notch_crack_value: 0.6
    crack_length_threshold: 0.4
    mech_max_iters: 80
    mech_outer_max_iters: 2
    mech_tol: 5.0e-5
    mech_outer_tol: 5.0e-6
    mech_regularization: 1.0e-4
    mech_accept_rel_residual: 1.0e-2
    mech_accept_incomplete_cg: true
    mech_enable_gmres_fallback: false
    mech_solution_abs_limit: 10.0
    mech_clip_solution_on_limit: true
    mech_unilateral_mode: volumetric
    mech_preconditioner: jacobi
  criteria:
    min_crack_delta: 5.0e-2
    min_crack_mean_delta: 5.0e-4
    allow_mean_aux: true
    min_crack_length_for_mean_aux: 1.0e-1
    min_onset_cases: 1
    max_runtime_warnings: 50
    max_mechanical_cg_failures: 1300
    max_mechanical_not_accepted_steps: 160
    max_crack_cg_nonconverged_steps: 320
    max_nonfinite_count: 0

cases:
  - name: "control_notch_mild"
    virtual_cycle:
      max_strain: 0.006
      toughness_scale: 0.10
      notch_crack_value: 0.55
  - name: "notch_medium_drive"
    virtual_cycle:
      max_strain: 0.010
      toughness_scale: 0.08
      notch_crack_value: 0.60
  - name: "notch_aggressive_drive"
    virtual_cycle:
      max_strain: 0.015
      toughness_scale: 0.06
      notch_crack_value: 0.70
  - name: "no_notch_control"
    virtual_cycle:
      max_strain: 0.010
      toughness_scale: 0.08
      notch_box: null
